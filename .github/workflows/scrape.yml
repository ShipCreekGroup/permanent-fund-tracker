name: Scrape latest data

on:
  workflow_dispatch:
  schedule:
    # Hourly; scrape.sh skips if today was already scraped, so this retries
    # failed scrapes (eg the LLM being overloaded) until one succeeds.
    - cron: '38 * * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        # Matches the uv version that wrote parse.py.lock
        version: "0.11.1"
    - name: Check out this repo
      uses: actions/checkout@v4
    - name: Fetch latest data
      env:
        LLM_GEMINI_KEY: ${{ secrets.LLM_GEMINI_KEY }}
      run: LLM_GEMINI_KEY=$LLM_GEMINI_KEY ./scrape.sh
    - name: Commit and push if it changed
      # Also commit when scrape.sh saved data but failed its category check.
      if: always()
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(TZ=America/Anchorage date)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push